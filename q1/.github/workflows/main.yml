name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

jobs:
  test-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: TDS identity: 24f1000086@ds.study.iitm.ac.in
        run: echo "Identity verified"

      - name: Start server in background
        run: |
          uvicorn main:app --port 8000 &
          sleep 3

      - name: Test endpoint (Valid Payload)
        run: |
          PAYLOAD=$(cat << 'EOF'
          {
            "target": "preview",
            "event": "pull_request",
            "ref": "refs/heads/feature",
            "workflow": {
              "trigger": "pull_request",
              "permissions": {"contents":"read", "packages":"write", "id-token":"none"},
              "testsPassed": true,
              "matrixComplete": true,
              "failFast": false,
              "actions": [{"owner":"actions", "name":"checkout", "ref":"v4"}]
            },
            "image": {
              "multiStage": true,
              "runsAsRoot": false,
              "secretMode": "none",
              "criticalVulnerabilities": 0,
              "digestPinned": true
            }
          }
          EOF
          )
          RESPONSE=$(curl -s -X POST http://localhost:8000/release-gate -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"decision":"promote"'; then
            echo "Test passed"
          else
            echo "Test failed"
            exit 1
          fi

      - name: Test endpoint (Invalid Payload)
        run: |
          PAYLOAD=$(cat << 'EOF'
          {
            "target": "preview",
            "event": "pull_request",
            "ref": "refs/heads/feature",
            "workflow": {
              "trigger": "pull_request_target",
              "permissions": {"contents":"write", "packages":"write", "id-token":"none"},
              "testsPassed": false,
              "matrixComplete": true,
              "failFast": false,
              "actions": [{"owner":"actions", "name":"checkout", "ref":"v4"}]
            },
            "image": {
              "multiStage": true,
              "runsAsRoot": false,
              "secretMode": "none",
              "criticalVulnerabilities": 0,
              "digestPinned": true
            }
          }
          EOF
          )
          RESPONSE=$(curl -s -X POST http://localhost:8000/release-gate -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"decision":"block"'; then
            echo "Test passed"
          else
            echo "Test failed"
            exit 1
          fi
