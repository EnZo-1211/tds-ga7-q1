name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install fastapi uvicorn httpx

      - name: Run server in background
        run: uvicorn main:app --host 127.0.0.1 --port 8000 &
        env:
          PYTHONPATH: .

      - name: Wait for server
        run: sleep 3

      - name: TDS identity: 24f1000086@ds.study.iitm.ac.in
        run: echo "Verified"

      - name: Test endpoint
        run: |
          curl -s -X POST http://127.0.0.1:8000/q1/release-gate \
          -H "Content-Type: application/json" \
          -d '{
            "target": "preview",
            "event": "push",
            "ref": "refs/heads/feature",
            "workflow": {
              "trigger": "push",
              "permissions": {"contents":"read", "packages":"write", "id-token":"none"},
              "testsPassed": true, "matrixComplete": true, "failFast": false,
              "actions": [{"owner":"actions", "name":"checkout", "ref":"v4"}]
            },
            "image": {
              "multiStage": true, "runsAsRoot": false, "secretMode": "none",
              "criticalVulnerabilities": 0, "digestPinned": true
            }
          }' | grep '"decision":"promote"'
